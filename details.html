<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details — Attendance App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="page-header">
            <h1>Student Details</h1>
        </div>

        <div class="input-group">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Full name">
        </div>

        <div class="input-group">
            <label for="regNo">Register Number</label>
            <input type="text" id="regNo" placeholder="e.g., 2024CS001">
        </div>

        <div class="input-group">
            <label for="dept">Department</label>
            <input type="text" id="dept" placeholder="e.g., Computer Science">
        </div>

        <div class="text-center mt-12">
            <img src="IMAGE.jfif" alt="Student Photo" class="student-img">
        </div>

        <div class="mt-20">
            <a href="leave planner.html">&larr; Back to Dashboard</a>
        </div>
    </div>
</body>

</html>
